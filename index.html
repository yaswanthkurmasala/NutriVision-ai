<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NutriVision AI</title>
  <link rel="manifest" href="/manifest.json">
  
  <!-- Android & iOS Native Mobile Optimization -->
  <meta name="theme-color" content="#0c1a0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(err => console.log('SW unregister check:', err));
      });
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary': '#13ec37',
            'background-dark': '#0c1a0e',
            'surface-dark': '#152b18',
          },
          fontFamily: {
            'sans': ['Lexend', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0c1a0e;
      color: #f1f5f9;
      overflow-x: hidden;
      font-family: 'Lexend', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .fab-glow {
      box-shadow: 0 0 25px rgba(19, 236, 55, 0.4);
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .view-enter {
      animation: view-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes view-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
